---
deployment:
  tasks:
    - export DEPLOYPATH=/home/larissab/public_html/genesis
    - export TMPVIDEO=/home/larissab/VIDEO-GENESIS-BACKUP.MP4

    # cria a pasta
    - /bin/mkdir -p $DEPLOYPATH

    # salva o vídeo antes de limpar
    - /bin/cp -f $DEPLOYPATH/VIDEO-GENESIS.MP4 $TMPVIDEO 2>/dev/null; true

    # limpa o destino
    - /bin/rm -rf $DEPLOYPATH/*

    # copia os arquivos do repo
    - /bin/cp -R ./* $DEPLOYPATH/

    # restaura o vídeo
    - /bin/mv -f $TMPVIDEO $DEPLOYPATH/VIDEO-GENESIS.MP4 2>/dev/null; true

    # remove o que não deve ir pro site
    - /bin/rm -f $DEPLOYPATH/.cpanel.yml
    - /bin/rm -f $DEPLOYPATH/.gitignore